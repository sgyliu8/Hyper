[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperlab"
version = "0.4.0"
description = "Local evidence-based hyperspectral recovery and analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "Pillow>=10,<13",
                "PySide6==6.10.3", "pyqtgraph==0.14.0", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "spectral==0.24"]
camera = ["harvesters==1.4.3"]

[project.scripts]
hyperlab = "hyperlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hyperlab.resources" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: explicit physical device validation"]
