[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperlab"
version = "0.1.0"
description = "Local evidence-based hyperspectral recovery and analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
camera = ["harvesters==1.4.3"]

[project.scripts]
hyperlab = "hyperlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: explicit physical device validation"]
