name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt offscreen runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Non-editable wheel in a separate virtual environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\hyperlab-venv"
          $python = "$env:RUNNER_TEMP\hyperlab-venv\Scripts\python.exe"
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python packaging/public_files.py --wheel $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip install $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:HYPERLAB_CONFIG_DIR = "$env:RUNNER_TEMP\hyperlab-config"
          $env:HYPERLAB_WORKSPACE = "$env:RUNNER_TEMP\hyperlab-workspace"
          $env:QT_QPA_PLATFORM = 'offscreen'
          Set-Location $env:RUNNER_TEMP
          & $python -m hyperlab doctor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m hyperlab.offline_smoke
          exit $LASTEXITCODE
